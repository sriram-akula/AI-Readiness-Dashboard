name: Update Live Dashboard

on:
  schedule:
    - cron: "*/30 * * * *"   # refresh every 30 minutes
  workflow_dispatch: {}       # lets you also trigger it manually from the Actions tab
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas

      - name: Generate dashboard from live Google Sheet
        run: |
          mkdir -p site
          python generate_dashboard.py "$SHEET_CSV_URL" site/index.html
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
